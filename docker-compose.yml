version: '3'
services:
  backend:
    build: ./backend
    container_name: kantin-backend
    ports:
      - "5001:5000"
    restart: always
    environment:
      - FLASK_ENV=development
      
  frontend:
    build: ./frontend
    container_name: kantin-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always
